<head>
  <title>三国杀小抄</title>
  <meta charset="utf-8" />
  <style type="text/css">
    #tracker-shell,
    #seatUI,
    .tooltip,
    #sidebarHint,
    .particle {
      --bg-primary: rgb(35, 32, 29);
      --bg-secondary: rgb(30, 26, 23);
      --bg-hover: rgb(55, 40, 32);
      --text-gold: #f2de9c;
      --text-gold-light: #c4b28a;
      --text-red: #e56666;
      --border-color: rgba(92, 78, 60, 0.5);
      --shoupai-width: 33px;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      border: 1px solid rgb(5, 5, 5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgb(95, 86, 63);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgb(44, 44, 44);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .body {
      width: 100%;
      height: 100%;
      padding: 0;
      font-size: 13px;
      background: var(--bg-primary);
      /* 背景图的适应方式，可以根据需求调整 */
      background-size: cover;
      color: var(--text-gold);
      display: flex;
      flex-direction: column;
      margin: 0;
      user-select: none;
      /* 限制页面宽度不超过屏幕宽度 */
      max-width: 100vw;
      font-family: -apple-system, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, "Segoe UI Emoji", 'Segoe UI Symbol', sans-serif;
      overflow: hidden;
    }

    .nav {
      width: 100%;
      background: var(--bg-primary);
      flex: 0 0 auto;
      z-index: 10000;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding: 8px;
      position: relative;
    }

    .nav-row::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-gold), transparent);
    }

    .nav-item {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-secondary);
      border: 1px solid rgba(92, 78, 60, 0.5);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--text-gold-light);
      line-height: 1;
      white-space: nowrap;
    }

    .nav-item svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      flex: 0 0 auto;
    }

    .text-sgs-red {
      color: var(--text-red);
    }

    .nav1,
    .sha {
      font-weight: normal;
      color: var(--text-gold-light);
      background: transparent;
      margin: 0;
      display: block;
    }

    .nav1 {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      padding-right: 1px;
      margin: 1px;
    }

    .orderContainer,
    #orderAndShouPai {
      text-align: right;
      vertical-align: bottom;
    }

    .order-body:empty {
      height: 35px;
    }

    .order-body {
      position: relative;
      padding: 5px;
      height: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      box-shadow: inset 0px 0px 3px 0px;
      z-index: 1;
      margin: 1px;
      overflow: hidden;
      border-radius: 5px;
    }

    .order-body:after,
    .cardTypeDetail:after {
      text-align: center;
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
    }

    .order-body:after {
      content: var(--No-content, '座位号丨武将');
    }

    .knownCards:empty {
      text-align: center;
      position: relative;
      overflow: hidden;
      display: none;
    }

    .knownCards {
      text-align: center;
      position: relative;
      overflow: hidden;
      height: auto;
    }

    @keyframes blink {
      50% {
        border-color: var(--text-gold);
      }
    }

    .paiduiCards:after {
      content: '牌堆';
    }

    #deckEdgeUI .paiduiCards:after {
      display: none;
    }

    .qipaiCards:after {
      content: '本回合弃牌堆';
    }

    .knownCards:after {
      content: '场上手牌';
    }

    .cardTypeDetail:after {
      content: '牌堆类型详情';
    }

    .cardDetail {
      min-height: 40px;
      padding: 4px;
      box-shadow: 0px 0px 2px;
      margin: 2px;
      border-radius: 5px;
      overflow: hidden;
    }

    .type-body {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 2px;
      box-shadow: inset 0px 0px 2px 0px;
      margin: 1px;
      overflow: hidden;
      border-radius: 5px;
    }

    #storeDetail {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .cardType,
    .storeDetail {
      font-size: 12px;
      height: 22px;
      text-align: center;
      border: 1px;
      margin: 0;
      background: rgb(210, 200, 160);
      box-shadow: inset 1px 1px 1px #000;
    }

    .cardType.active {
      color: black;
    }

    .cardType.inactive {
      color: gray;
    }

    fieldset {
      margin: 0 2px 2px;
      padding: 4px;
      min-height: 40px;
      border: none;
      box-shadow: 0px 0px 2px;
      border-radius: 4px;
    }

    /* 阴影充当边框，legend 处用底色遮断阴影线，避免文字压线 */
    fieldset>legend {
      margin-left: 4px;
      background: var(--bg-primary);
    }

    .rogue-attr-body {
      display: flex;
      margin-top: 2px;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 0;
    }

    .rogue-attr-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border: 1px solid rgba(242, 222, 156, 0.6);
      border-radius: 10px;
      background: rgba(55, 40, 32, 0.8);
      color: var(--text-gold);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      cursor: help;
    }

    .panel-header {
      background: var(--bg-primary);
      color: var(--text-gold);
      padding: 3px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 5px;
      border: 1px transparent solid;
      font-size: 13px;
    }

    .triangle {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 6px solid var(--text-gold);
      margin-right: 10px;
      transition: transform 0.3s ease;
    }

    .panel-content {
      display: grid;
      width: 100%;
      margin-bottom: 2px;
      grid-template-rows: minmax(0, 0fr);
      color: var(--text-gold);
      overflow: hidden;
      border-radius: 5px;
      background: var(--bg-primary);
      transition: grid-template-rows 0.3s ease-out;
    }

    .panel-header.active+.panel-content {
      grid-template-rows: minmax(0, 1fr);
    }

    .panel-content-inner {
      min-height: 0;
      overflow: hidden;
    }

    .panel-content.order>.panel-content-inner {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .panel-header.active .triangle {
      transform: rotate(90deg);
    }

    .panel-header.active {
      color: var(--text-gold);
      background: var(--bg-hover);
    }

    .suits-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
    }

    .suitRec {
      text-shadow:
        1px 0 0 rgba(255, 255, 255, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.7),
        -1px 0 0 rgba(255, 255, 255, 0.7),
        0 -1px 0 rgba(255, 255, 255, 0.7);
    }

    .suit {
      font-family:
        -apple-system, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, "Segoe UI Emoji", sans-serif;
    }

    .suit-glyph {
      display: inline-block;
      line-height: 1;
      min-width: 0.72em;
      text-align: center;
      font-family: -apple-system, "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      /* 花色大小 */
      font-size: 1.1em;
      font-weight: 700;
      vertical-align: -0.08em;
    }

    .suitRec .suit-glyph,
    .suit .suit-glyph {
      margin-right: 1px;
    }

    .calRes,
    .mizhuBTN,
    .protocol-recorder-button {
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      border: 1px solid var(--text-gold);
      border-radius: 5px;
      cursor: pointer;
    }

    .calRes {
      width: 98%;
      height: 20px;
      display: block;
      font-size: 13px;
      margin: 1px;
    }

    /* 仅在按钮未被禁用时应用的 hover 效果 */
    .calRes:not(:disabled):hover {
      font-size: 12px;
    }

    .mizhuBTN {
      margin-top: 2px;
      width: 50%;
    }

    #quanDao {
      height: 20px;
      line-height: 20px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #result {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .uuid {
      position: relative;
      color: var(--text-gold);
      display: block;
      text-align: center;
      /* Change cursor to pointer on hover */
      cursor: pointer;
    }

    .cardType:hover,
    .panel-header:hover,
    .calRes:not(:disabled):hover,
    .mizhuBTN:hover,
    .uuid:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s infinite;
    }

    .uuid:active {
      background: var(--bg-hover);
    }

    .switch-container-row {
      display: flex;
    }

    .protocol-recorder-controls {
      width: 100%;
      margin-top: 4px;
    }

    .protocol-recorder-actions {
      display: flex;
      gap: 6px;
      padding: 0 10px;
    }

    .protocol-recorder-button {
      flex: 1;
      height: 24px;
    }

    .protocol-recorder-button:disabled {
      color: #777;
      border-color: #777;
      cursor: not-allowed;
    }

    .protocol-recorder-status {
      width: 100%;
      margin-top: 4px;
      color: var(--text-gold);
      font-size: 12px;
      text-align: center;
    }

    .protocol-recorder-status[data-recording='true'] {
      color: #ff7b54;
    }

    .switch {
      position: relative;
      display: block;
      margin-left: 10px;
      /* 计算每个容器的宽度，考虑了左侧的 margin */
      width: 56px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-primary);
      -webkit-transition: 0.4s;
      transition: 0.4s;
      border-radius: 34px;
      border: 1px solid var(--text-gold);
      --slider-position: 2px;
    }

    .slider:before {
      position: absolute;
      content: '';
      height: 20px;
      width: 20px;
      /* Default to 2px if the variable isn't set */
      left: var(--slider-position, 2px);
      bottom: 2px;
      background-color: var(--text-gold);
      -webkit-transition: 0.4s;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #ff7b54;
    }

    .switch input:checked+.slider:before {
      transform: translateX(30px);
    }

    .status {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      /* 调整位置 */
      left: 5px;
      /* 文字颜色 */
      color: #555;
    }

    .explanation {
      margin: 0 10px;
      display: flex;
      width: 100%;
    }

    input:checked+.slider+.status:before {
      content: '开';
    }

    input+.slider+.status:before {
      content: '关';
    }

    .calRes:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    .markedCard {
      order: 1;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border-radius: 5px;
      border: 1px solid black;
      width: auto;
      background-color: var(--bg-hover);
      color: var(--text-gold);
    }

    .mark {
      writing-mode: vertical-rl;
      color: var(--text-gold);
    }

    .markedCard>.mark:only-child {
      display: none;
    }

    .shoupai {
      color: black;
      padding: 0;
      position: relative;
      font-weight: bolder;
      margin-right: calc(32px - var(--shoupai-width));
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: var(--shoupai-width);
      min-width: var(--shoupai-width);
      height: 38px;
      border: 1px solid black;
      text-align: center;
      background: rgba(210, 200, 160, 0.75);
      border-radius: 5px;
      font-family: -apple-system, PingFang SC, Hiragino Sans GB, "Segoe UI Emoji", "Microsoft YaHei", "Segoe UI Symbol", sans-serif;
      /* 防止文本换行 */
      white-space: nowrap;
      font-size: 13px;
    }

    /* 候选牌 */
    .shoupai.candidate-card {
      background: 0;
    }

    .shoupai .card-cn,
    .shoupai .card-cn .rank-glyph {
      display: inline-block;
    }

    .shoupai .card-name {
      display: block;
      box-sizing: content-box;
      padding: 2px;
      margin: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .shoupai .card-cn .suit-glyph {
      min-width: 0.56em;
      margin-right: 0;
      transform: none;
    }

    .shoupai .card-name,
    .shoupai .suit-heart,
    .shoupai .suit-diamond {
      text-shadow:
        1px 1px 1px #F6F1E6,
        -1px -1px 1px #F6F1E6,
        1px -1px 1px #F6F1E6,
        -1px 1px 1px #F6F1E6;
    }

    .r,
    .suit-heart,
    .suit-diamond {
      color: rgb(240, 65, 85);
    }

    .suit-diamond {
      filter: hue-rotate(110deg) brightness(1.1);
    }

    .suit-spade {
      color: #4a90e2;
      filter: brightness(0) invert(30%) sepia(1) saturate(8000%) hue-rotate(203deg) brightness(1.2);
    }

    .suit-club {
      color: #790071;
      filter: brightness(0) invert(25%) sepia(1) saturate(6000%) hue-rotate(265deg) brightness(1.2);
    }

    .shoupai .card-cn-long {
      font-size: 12px;
      letter-spacing: -1px;
    }

    .shoupai .card-cn-long .suit-glyph {
      font-size: 1em;
    }

    .shoupai.red-card {
      color: red;
    }

    .shoupai.unknown-card {
      color: #bbb;
      background: 0;
    }

    .shoupai.unknown-card .shoupai {
      background: 0;
      pointer-events: none;
    }

    :is(.order-body, .sorder-body):not(.paiduiCards) .shoupai:disabled {
      display: none;
    }

    :is(.order-body, .sorder-body):not(.paiduiCards) .shoupai.unknown-card {
      width: auto;
    }

    input[type='checkbox']:disabled+.slider {
      /* 禁用时 slider 的背景颜色变灰 */
      background-color: gray;
      /* 禁用时鼠标变为不可用状态 */
      cursor: not-allowed;
    }

    .tooltip {
      position: fixed;
      inset: auto;
      margin: 0;
      box-sizing: border-box;
      background: rgba(51, 51, 51, 0.96);
      text-align: center;
      padding: 5px 8px;
      border-radius: 5px;
      border: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      max-width: 200px;
      white-space: pre-line;
      z-index: 10000000001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-in-out;
      color: var(--text-gold);
      font-size: 13px;
      line-height: 1.35;
    }

    .tooltip:popover-open,
    .tooltip.dialog-tooltip {
      position: absolute;
      inset: auto;
      margin: 0;
      z-index: 2147483647;
    }

    .tooltip.visible {
      opacity: 1;
    }

    .tooltip.top {
      margin-left: 0;
    }

    #sidebarHint {
      position: fixed;
      top: 0;
      right: 0;
      width: 25px;
      height: 100%;
      background-color: rgba(55, 40, 32, 0.8);
      color: var(--text-gold);
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      writing-mode: vertical-rl;
      /* 保持文字直立 */
      text-orientation: upright;
    }

    .sorderContainer {
      /* 默认字体大小，可以根据需要调整 */
      font-size: 13px;
      /* 使用Flexbox布局 */
      display: flex;
      /* 垂直居中对齐子元素 */
      align-items: center;
      width: 146px;
      z-index: 10000000000;
      user-select: none;
      text-align: left;
      transition: height 200ms;
      position: fixed;
      transform-origin: 0 0;
    }

    .sorder-body {
      /* 子元素可以接收鼠标事件 */
      pointer-events: auto;
      height: auto;
      width: 100%;
      float: right;
      display: flex;
      flex-wrap: wrap;
      /* 允许内容自动换行 */
      overflow: hidden;
      z-index: 1;
      /* 设置一行内容的高度 */
      max-height: 48px;
    }

    /* 使用 ::after 模拟省略号 */
    .sorder-body.show-ellipsis::after {
      content: '...';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: var(--text-gold);
      font-weight: bold;
      height: 20px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgb(0 0 0 / 80%));
      width: inherit;
    }

    /* 鼠标悬停时显示完整内容并隐藏省略号 */
    .sorder-body:hover {
      max-height: none;
      overflow: visible;
    }

    .sorder-body:hover::after {
      display: none;
    }

    @keyframes fadeInLeftToRight {
      0% {
        clip-path: inset(0 100% 0 0);
        opacity: 0;
      }

      100% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }
    }

    @keyframes fadeOutRightToLeft {
      0% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }

      100% {
        clip-path: inset(0 100% 0 0);
        opacity: 0;
      }
    }

    .show {
      animation:
        fadeInLeftToRight 1s forwards,
        blink 2s infinite;
      visibility: visible;
    }

    .hide {
      animation: fadeOutRightToLeft 1s forwards;
      visibility: hidden;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: var(--text-gold);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 10000000001;
    }

    .mouse-pressed .sorder-body {
      pointer-events: none;
    }

    /* 屏蔽设置 Dialog 及扩展开关样式 */
    .expandable-switch {
      position: relative;
    }

    .expandable-switch .explanation {
      cursor: pointer;
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
    }

    .expandable-switch .explanation:after {
      content: '⚙️';
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .expandable-switch .explanation:hover:after {
      opacity: 1;
    }

    /* Dialog 弹窗样式 */
    dialog {
      border: none;
      border-radius: 8px;
      padding: 0;
      background: rgba(35, 32, 29, 0.95);
      color: var(--text-gold);
      width: 200px;
      height: auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      margin: 0;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: visible;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid rgba(242, 222, 156, 0.3);
      margin: 0;
    }

    .dialog-header h3 {
      margin: 0;
      color: var(--text-gold);
      font-size: 14px;
      font-weight: bold;
    }

    .dialog-close-btn {
      background: none;
      border: none;
      color: var(--text-gold);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }

    .dialog-close-btn:hover {
      background: rgba(242, 222, 156, 0.2);
    }

    .dialog-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Tab 栏与 Tab 面板 */
    .tab-bar {
      display: flex;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      padding: 0 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-gold-light);
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      font-family: inherit;
    }

    .tab-btn:focus,
