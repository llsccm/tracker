<head>
  <title>三国杀小抄</title>
  <meta charset="utf-8" />
  <style type="text/css">
    .createIframe,
    #seatUI,
    #rogueUI,
    .tooltip,
    #sidebarHint,
    .city,
    .particle {
      --my-background-image: url('https://web.sanguosha.com/220/h5_2/res/assets/bigPng/propGet.png');
      --bg-primary: rgb(35, 32, 29);
      --bg-secondary: rgb(30, 26, 23);
      --bg-hover: rgb(55, 40, 32);
      --text-gold: #f2de9c;
      --text-gold-light: #c4b28a;
      --text-red: #e56666;
      --border-color: rgba(92, 78, 60, 0.5);
      --shoupai-width: 33px;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      border: 1px solid rgb(5, 5, 5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgb(95, 86, 63);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgb(44, 44, 44);
    }

    .body {
      width: 100%;
      padding: 0;
      font-size: 13px;
      background: var(--bg-primary);
      /* 背景图的适应方式，可以根据需求调整 */
      background-size: cover;
      color: var(--text-gold);
      display: flex;
      flex-direction: column;
      margin: 1px;
      user-select: none;
      /* 限制页面宽度不超过屏幕宽度 */
      max-width: 100vw;
      font-family: -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, 'Segoe UI Symbol', sans-serif;
    }

    .nav {
      width: 100%;
      background: var(--bg-primary);
      position: sticky;
      top: 0;
      z-index: 10000;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding: 8px;
    }

    .nav-item {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-secondary);
      border: 1px solid rgba(92, 78, 60, 0.5);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--text-gold-light);
      line-height: 1;
      white-space: nowrap;
    }

    .nav-item svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      flex: 0 0 auto;
    }

    .nav-divider {
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, var(--text-gold), transparent);
    }

    .text-sgs-red {
      color: var(--text-red);
    }

    .nav1 {
      font-weight: normal;
      color: var(--text-gold-light);
      background: transparent;
      margin: 0;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sha {
      font-weight: normal;
      color: var(--text-gold-light);
      background: transparent;
      margin: 0;
      display: block;
    }

    #nav1:empty {
      display: none;
    }

    .nav2 {
      height: 20px;
      width: 49%;
      float: right;
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      margin-left: 3px;
      border: 1px solid var(--text-gold);
      display: block;
      border-radius: 5px;
    }

    .nav2:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px solid var(--text-gold);
    }

    .nav2:focus {
      background: var(--bg-hover);
      box-shadow: 1px 1px 3px var(--text-gold);
    }

    .content {
      margin: 1px;
    }

    .AC-head {
      font-weight: bolder;
      height: 66px;
      width: 13%;
      float: right;
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      margin: 1px;
      border-radius: 5px;
      border: 1px var(--bg-primary) solid;
      box-shadow: 1px 0px 3px;
      overflow: hidden;
      font-size: 15px;
    }

    .AC-head:hover {
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .AC-body {
      height: 60px;
      width: 79%;
      float: left;
      box-shadow: 1px 0px 3px;
      border: 1px var(--bg-primary) solid;
      color: var(--text-gold);
      margin: 1px;
      overflow: hidden;
      border-radius: 5px;
      background: var(--bg-primary);
      resize: none;
      font-size: 13px;
    }

    .invite-body {
      height: 40px;
      width: 92%;
      float: left;
      display: flex;
      box-shadow: 1px 0px 3px;
      border: 1px var(--bg-primary) solid;
      color: var(--text-gold);
      margin: 5px;
      overflow: hidden;
      border-radius: 5px;
      background: var(--bg-primary);
      resize: none;
      font-size: 13px;
    }

    .orderContainer {
      text-align: right;
      vertical-align: bottom;
    }

    .order-head {
      font-weight: bolder;
      width: 10%;
      height: 25px;
      float: left;
      text-align: center;
      color: var(--text-gold);
      margin-left: 3px;
    }

    .order-body:empty {
      height: 35px;
    }

    .order-body {
      position: relative;
      padding: 5px;
      height: auto;
      width: 94%;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      box-shadow: 1px 1px 3px;
      z-index: 1;
      margin: 1px;
      overflow: hidden;
      border-radius: 5px;
    }

    .order-body:after {
      text-align: center;
      content: var(--No-content, '座位号丨武将');
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .knownShouPai {
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .knownCardsInHand {
      text-align: center;
      position: relative;
      overflow: hidden;
      display: none;
      height: auto;
    }

    .knownCards:empty {
      text-align: center;
      position: relative;
      overflow: hidden;
      display: none;
    }

    .knownCards {
      width: 94%;
      text-align: center;
      position: relative;
      overflow: hidden;
      height: auto;
    }

    @keyframes blink {
      50% {
        border-color: var(--text-gold);
      }
    }

    .paiduiCards:after {
      text-align: center;
      content: '牌堆';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    #deckEdgeUI .paiduiCards:after {
      display: none;
    }

    .qipaiCards:after {
      text-align: center;
      content: '本回合弃牌堆';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .knownCards:after {
      text-align: center;
      content: '场上手牌';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    #quanBian:after {
      text-align: center;
      content: '权变牌';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    #yanXi:after {
      text-align: center;
      content: '宴戏牌';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .cardTypeDetail:after {
      text-align: center;
      content: '牌堆类型详情';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .ding {
      text-align: center;
      width: 100%;
      position: relative;
      height: auto;
      display: none;
    }

    .dingCards {
      text-align: center;
      position: relative;
      height: auto;
      min-height: 60px;
      display: none;
    }

    .dingCards:after {
      content: '第一张为牌堆顶';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .di {
      text-align: center;
      width: 100%;
      position: relative;
      height: auto;
      display: none;
    }

    .diCards {
      text-align: center;
      position: relative;
      height: auto;
      min-height: 60px;
      display: none;
    }

    .diCards:after {
      content: '第一张为牌堆底';
      position: absolute;
      bottom: 0;
      right: 5px;
      z-index: -1;
      font: 800 20px 'Arial Black';
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke-width: 1px;
    }

    .cardDetail {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .type {
      width: 100%;
    }

    .cardTypeContainer {
      width: 100%;
      overflow: hidden;
      display: block;
    }

    .type-head {
      width: 10%;
      float: left;
      text-align: center;
      color: var(--text-gold);
      margin-left: 3px;
      display: block;
      overflow: hidden;
      cursor: pointer;
    }

    .type-body {
      padding: 5px;
      width: 94%;
      display: block;
      box-shadow: 1px 1px 3px;
      margin: 1px;
      overflow: hidden;
      border-radius: 5px;
    }

    .cardType {
      font-size: 12px;
      width: 25%;
      height: 22px;
      float: left;
      text-align: center;
      border: 1px;
      margin: 0;
      background: rgb(210, 200, 160);
      box-shadow: inset 1px 1px 1px #000;
    }

    .cardType.active {
      color: black;
    }

    .cardType.inactive {
      color: gray;
    }

    .cardType:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .storeDetail {
      font-size: 12px;
      width: 50%;
      height: 22px;
      float: left;
      text-align: center;
      border: 1px;
      margin: 0;
      background: rgb(210, 200, 160);
      box-shadow: inset 1px 1px 1px #000;
    }

    .detail {
      width: 100%;
      overflow: hidden;
    }

    .detail-head {
      width: 10%;
      height: 25px;
      float: left;
      text-align: center;
      color: var(--text-gold);
      margin-left: 3px;
    }

    .detail-body {
      min-height: 40px;
      padding: 5px;
      width: 94%;
      display: block;
      box-shadow: 1px 1px 3px;
      margin: 1px;
      border-radius: 5px;
      overflow: hidden;
    }

    .rogue-attr-head {
      float: none;
      width: auto;
      text-align: center;
      white-space: nowrap;
    }

    .rogue-attr-body {
      float: none;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 0;
    }

    .rogue-attr-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border: 1px solid rgba(242, 222, 156, 0.6);
      border-radius: 10px;
      background: rgba(55, 40, 32, 0.8);
      color: var(--text-gold);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .panel-header {
      background: var(--bg-primary);
      color: var(--text-gold);
      padding: 3px;
      text-align: left;
      border: none;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 5px;
      border: 1px transparent solid;
      font-size: 13px;
    }

    .triangle {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 6px solid var(--text-gold);
      margin-right: 10px;
      transition: transform 0.3s ease;
    }

    .panel-content {
      width: 100%;
      display: grid;
      grid-template-rows: minmax(0, 0fr);
      color: var(--text-gold);
      overflow: hidden;
      border-radius: 5px;
      background: var(--bg-primary);
      transition: grid-template-rows 0.3s ease-out;
    }

    .panel-header.active+.panel-content {
      grid-template-rows: minmax(0, 1fr);
    }

    .panel-content-inner {
      min-height: 0;
      overflow: hidden;
    }

    .panel-content.order>.panel-content-inner {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-header.active .triangle {
      transform: rotate(90deg);
    }

    .panel-header.active {
      color: var(--text-gold);
      background: var(--bg-hover);
    }

    .panel-header:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .r {
      color: rgb(240, 65, 85);
    }

    .suits-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
    }

    .suitRec {
      text-shadow:
        1px 0 0 rgba(255, 255, 255, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.7),
        -1px 0 0 rgba(255, 255, 255, 0.7),
        0 -1px 0 rgba(255, 255, 255, 0.7);
    }

    .suit {
      font-family:
        -apple-system, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, 'Segoe UI Symbol', sans-serif;
    }

    .suit-glyph {
      display: inline-block;
      line-height: 1;
      min-width: 0.72em;
      text-align: center;
      /* 花色大小 */
      font-size: 1.1em;
      font-weight: 700;
      vertical-align: -0.08em;
    }

    .suitRec .suit-glyph,
    .suit .suit-glyph {
      margin-right: 1px;
    }

    .phrase {
      float: left;
    }

    .face {
      width: 12.5%;
      display: block;
      float: left;
    }

    .face:hover {
      width: 12.5%;
      display: block;
      float: left;
      background: var(--text-gold);
    }

    #shandian {
      width: 100%;
      float: left;
    }

    .function {
      width: 50%;
      margin: 1px;
    }

    .jizhan {
      width: 100%;
      float: left;
    }

    .yanjiao {
      width: 50%;
      float: left;
    }

    .yanjiaospan {
      border: 1px solid #0000;
      box-sizing: border-box;
    }

    .yanjiaospan:hover {
      border: 1px solid var(--text-gold);
      cursor: pointer;
    }

    .calRes {
      width: 98%;
      height: 20px;
      float: left;
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      border: 1px solid var(--text-gold);
      display: block;
      border-radius: 5px;
      font-size: 13px;
      margin: 1px;
    }

    /* 仅在按钮未被禁用时应用的 hover 效果 */
    .calRes:not(:disabled):hover {
      font-size: 12px;
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .mizhuBTN {
      width: 48%;
      height: 20px;
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      border: 1px solid var(--text-gold);
      display: block;
      border-radius: 5px;
      font-size: 13px;
    }

    .mizhuBTN:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .mizhu {
      width: 100%;
      height: 20px;
      float: left;
      text-align: center;
      color: var(--text-gold);
      background: var(--bg-primary);
      margin-left: 3px;
      border: 1px solid var(--text-gold);
      display: block;
      border-radius: 5px;
    }

    .mizhu:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .res {
      width: 100%;
      float: left;
    }

    /* 超链接*/
    a:link,
    a:visited {
      color: inherit;
      /* or the specific color you want */
      text-decoration: none;
      /* Remove underline if desired */
      display: inline-flex;
      /* Use flexbox for centering */
      text-decoration: underline;
      /* 添加下划线 */
      border-radius: 5px;
      /* Rounded corners */
      cursor: pointer;
      /* Pointer cursor on hover */
      align-items: center;
      /* Vertically center */
      justify-content: center;
      /* Horizontally center */
    }

    a:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    #donate {
      position: relative;
      color: var(--text-gold);
      display: block;
      text-align: center;
    }

    .uuid {
      position: relative;
      color: var(--text-gold);
      display: block;
      text-align: center;
      /* Change cursor to pointer on hover */
      cursor: pointer;
    }

    .uuid:hover {
      color: var(--text-gold);
      background: var(--bg-hover);
      border: 1px var(--bg-primary) solid;
      animation: blink 2s;
      animation-iteration-count: infinite;
    }

    .uuid:active {
      background: var(--bg-hover);
    }

    .width {
      width: 100%;
      height: 5px;
    }

    .switch-container-row {
      display: flex;
    }

    .switch {
      position: relative;
      display: block;
      margin-left: 10px;
      /* 计算每个容器的宽度，考虑了左侧的 margin */
      width: 56px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-primary);
      -webkit-transition: 0.4s;
      transition: 0.4s;
      border-radius: 34px;
      border: 1px solid var(--text-gold);
      --slider-position: 2px;
    }

    .slider:before {
      position: absolute;
      content: '';
      height: 20px;
      width: 20px;
      /* Default to 2px if the variable isn't set */
      left: var(--slider-position, 2px);
      bottom: 2px;
      background-color: var(--text-gold);
      -webkit-transition: 0.4s;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #ff7b54;
    }

    .switch input:checked+.slider:before {
      transform: translateX(30px);
    }

    .status {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      /* 调整位置 */
      left: 5px;
      /* 文字颜色 */
      color: #555;
    }

    .explanation {
      margin: 0 10px;
      display: flex;
      width: 100%;
    }

    input:checked+.slider+.status:before {
      content: '开';
    }

    input+.slider+.status:before {
      content: '关';
    }

    .calRes:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    .markedCard {
      order: 1;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border-radius: 5px;
      border: 1px solid black;
      width: auto;
      background-color: var(--bg-hover);
      color: var(--text-gold);
    }

    .mark {
      writing-mode: vertical-rl;
      margin-right: 0px;
      /* 按需调整间距 */
      color: var(--text-gold);
    }

    .markedCard>.mark:only-child {
      display: none;
    }

    .shoupai {
      color: black;
      --shoupai-width: 33px;
      padding: 0;
      position: relative;
      font-weight: bolder;
      margin-right: calc(32px - var(--shoupai-width));
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: var(--shoupai-width);
      min-width: var(--shoupai-width);
      height: 38px;
      border: 1px solid black;
      text-align: center;
      background: rgba(210, 200, 160, 0.75);
      border-radius: 5px;
      font-family: -apple-system, PingFang SC, Hiragino Sans GB, "Segoe UI Emoji", "Microsoft YaHei", "Segoe UI Symbol", sans-serif;
      /* 防止文本换行 */
      white-space: nowrap;
      font-size: 13px;
    }

    /* 候选牌 */
    .shoupai.candidate-card {
      background: 0;
    }

    .shoupai .card-cn {
      display: inline-block;
      /* line-height: 1; */
    }

    .shoupai .card-name {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      /* line-height: 1.05; */
      font-size: 14px;
      text-shadow:
        1px 1px 1px rgba(255, 255, 255, 0.6),
        -1px -1px 1px rgba(255, 255, 255, 0.6),
        1px -1px 1px rgba(255, 255, 255, 0.6),
        -1px 1px 1px rgba(255, 255, 255, 0.6);
    }

    .shoupai .card-cn .suit-glyph {
      min-width: 0.56em;
      /* font-size: 1.45em; */
      margin-right: 0;
