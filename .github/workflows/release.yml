name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: release-releases
  queue: max
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check release eligibility
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ ! "$GITHUB_REF_NAME" =~ ^v${version_pattern}$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH without a prerelease suffix."
            exit 1
          fi

          # 分页读取所有 Release；API 错误直接失败，不能当成“尚未发布”。
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          existing_release="$(jq --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)][0] // null' "$RUNNER_TEMP/releases.json")"
          if jq -e '.draft == true or .prerelease == true' <<< "$existing_release" > /dev/null; then
            echo "::error::Release $GITHUB_REF_NAME is a draft or prerelease. Resolve it before rerunning."
            exit 1
          fi

          current_version="${GITHUB_REF_NAME#v}"
          latest_version="$(jq -r --arg pattern "^v?${version_pattern}$" \
            '.[][] | select(.draft == false and .prerelease == false) | .tag_name |
            select(test($pattern)) | ltrimstr("v")' "$RUNNER_TEMP/releases.json" | sort -V | tail -n 1)"
          if [ -n "$latest_version" ]; then
            newest_version="$(printf '%s\n' "$latest_version" "$current_version" | sort -V | tail -n 1)"
            if [ "$newest_version" != "$current_version" ]; then
              echo "Release $GITHUB_REF_NAME is older than v$latest_version; skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "exists=$(jq '. != null' <<< "$existing_release")" >> "$GITHUB_OUTPUT"
          echo "VITE_version=$current_version" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: steps.release-check.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout releases branch
        if: steps.release-check.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: releases
          path: release-branch
          persist-credentials: true

      - name: Verify CI for the tagged commit
        if: steps.release-check.outputs.publish == 'true' && steps.release-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --branch main --event push --commit "$commit" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No main-branch CI run exists for $commit. Merge to main and wait for CI before releasing."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Setup pnpm
        if: steps.release-check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.release-check.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.release-check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build production userscript
        if: steps.release-check.outputs.publish == 'true' && steps.release-check.outputs.exists == 'false'
        run: pnpm build:prod

      - name: Validate release artifacts
        if: steps.release-check.outputs.publish == 'true' && steps.release-check.outputs.exists == 'false'
        run: |
          expected_update_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/daxiaochao.meta.js"
          expected_download_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/daxiaochao.user.js"
          for file in dist/daxiaochao.user.js dist/daxiaochao.meta.js; do
            test -s "$file"
            artifact_version="$(awk '$1 == "//" && $2 == "@version" { print $3 }' "$file")"
            if [ "$artifact_version" != "$VITE_version" ]; then
              echo "::error::$file has version $artifact_version; expected $VITE_version."
              exit 1
            fi
            update_url="$(awk '$1 == "//" && $2 == "@updateURL" { print $3 }' "$file")"
            if [ "$update_url" != "$expected_update_url" ]; then
              echo "::error::$file has updateURL $update_url; expected $expected_update_url."
              exit 1
            fi
            download_url="$(awk '$1 == "//" && $2 == "@downloadURL" { print $3 }' "$file")"
            if [ "$download_url" != "$expected_download_url" ]; then
              echo "::error::$file has downloadURL $download_url; expected $expected_download_url."
              exit 1
            fi
          done

      - name: Create and publish GitHub Release
        if: steps.release-check.outputs.publish == 'true' && steps.release-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/daxiaochao.user.js \
            dist/daxiaochao.meta.js \
            --verify-tag \
            --latest \
            --notes-file .github/release-notes/install.md \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Build CDN userscript
        if: steps.release-check.outputs.publish == 'true'
        run: pnpm build:cdn

      - name: Validate CDN artifacts
        if: steps.release-check.outputs.publish == 'true'
        run: |
          expected_update_url="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@releases/daxiaochao.meta.js"
          expected_download_url="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@releases/daxiaochao.user.js"
          for file in dist/daxiaochao.user.js dist/daxiaochao.meta.js; do
            test -s "$file"
            artifact_version="$(awk '$1 == "//" && $2 == "@version" { print $3 }' "$file")"
            if [ "$artifact_version" != "$VITE_version" ]; then
              echo "::error::$file has version $artifact_version; expected $VITE_version."
              exit 1
            fi
            update_url="$(awk '$1 == "//" && $2 == "@updateURL" { print $3 }' "$file")"
            if [ "$update_url" != "$expected_update_url" ]; then
              echo "::error::$file has updateURL $update_url; expected $expected_update_url."
              exit 1
            fi
            download_url="$(awk '$1 == "//" && $2 == "@downloadURL" { print $3 }' "$file")"
            if [ "$download_url" != "$expected_download_url" ]; then
              echo "::error::$file has downloadURL $download_url; expected $expected_download_url."
              exit 1
            fi
          done

      - name: Push userscripts to releases branch
        if: steps.release-check.outputs.publish == 'true'
        working-directory: release-branch
        run: |
          # Release 已发布后才使用 CDN 渠道产物更新 releases 分支。
          cp ../dist/daxiaochao.user.js ../dist/daxiaochao.meta.js .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- daxiaochao.user.js daxiaochao.meta.js
          if git diff --cached --quiet; then
            echo "Userscripts are already up to date."
            exit 0
          fi
          git commit -m "chore(release): publish ${GITHUB_REF_NAME}"
          git push origin HEAD:refs/heads/releases
