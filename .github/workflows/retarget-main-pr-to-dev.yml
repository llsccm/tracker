name: Retarget main PRs to dev

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: retarget-main-pr-to-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retarget:
    name: Retarget main PR base to dev
    runs-on: ubuntu-latest
    steps:
      - name: Retarget main PR base when required
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const prNumber = pr.number
            const { owner, repo } = context.repo

            const baseRef = pr.base?.ref
            const headRef = pr.head?.ref
            const headRepo = pr.head?.repo?.full_name
            const desiredBase = 'dev'
            const isDevToMain =
              baseRef === 'main' &&
              headRef === desiredBase &&
              headRepo === `${owner}/${repo}`

            if (baseRef !== 'main') {
              core.info(`PR #${prNumber} base is ${baseRef}; nothing to do.`)
              return
            }

            if (isDevToMain) {
              core.info(`PR #${prNumber} is ${desiredBase} -> main; skipping retarget.`)
              return
            }

            core.info(`Retargeting PR #${prNumber} base from ${baseRef} to ${desiredBase}.`)

            try {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                base: desiredBase,
              })
            } catch (error) {
              core.setFailed(`Failed to retarget PR #${prNumber} to ${desiredBase}: ${error.message}`)
              return
            }

            const body = [
              `This pull request targeted \`${baseRef}\`.`,
              '',
              `The base branch has been automatically changed to \`${desiredBase}\`.`,
            ].join('\n')

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              })
            } catch (error) {
              core.warning(`Failed to comment on PR #${prNumber}: ${error.message}`)
            }
